# Run only the API and migration job on the workstation. MySQL and Redis stay
# on the cloud host and are reached through SSH tunnels on the host machine.
name: mingshu-backend-remote-dev

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: mingshu-backend:dev
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
    command: ["alembic", "upgrade", "head"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mingshu-backend:dev
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-mingshu-api}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      REGISTRATION_BONUS_POINTS: ${REGISTRATION_BONUS_POINTS:-20}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-60}
      OTP_DAILY_LIMIT: ${OTP_DAILY_LIMIT:-10}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      PASSWORD_MAX_ATTEMPTS: ${PASSWORD_MAX_ATTEMPTS:-5}
      PASSWORD_LOCK_MINUTES: ${PASSWORD_LOCK_MINUTES:-15}
      PROFILE_EDIT_COOLDOWN_DAYS: ${PROFILE_EDIT_COOLDOWN_DAYS:-30}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-low}
      AI_KIMI_THINKING: ${AI_KIMI_THINKING:-false}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      AI_PER_USER_PER_MINUTE: ${AI_PER_USER_PER_MINUTE:-3}
      AI_PER_USER_DAILY_REQUESTS: ${AI_PER_USER_DAILY_REQUESTS:-30}
      AI_DAILY_TOKEN_BUDGET: ${AI_DAILY_TOKEN_BUDGET:-500000}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-4}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
